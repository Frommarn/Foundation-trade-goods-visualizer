<!DOCTYPE html>
<html>

<head>
  <title>Trade Good Dependencies</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }

    #chart {
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
    }

    .node circle {
      stroke: #fff;
      stroke-width: 1.5px;
    }

    .link {
      stroke: #999;
      stroke-opacity: 0.6;
    }

    .tooltip {
      position: absolute;
      text-align: center;
      padding: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border-radius: 4px;
      pointer-events: none;
      /* Prevent tooltip from blocking mouse events */
      opacity: 0;
      transition: opacity 0.2s;
    }

    .node text {
      /* Adjust font size as needed */
      font-size: 10px;
    }
  </style>
</head>

<body>

  <h1>Trade Good Dependency Visualization</h1>

  <input type="file" id="csvFileInput" accept=".csv">
  <button onclick="exportCSV()">Export CSV</button>

  <div>
    <label><input type="radio" name="visualization" value="force" checked> Force Directed</label>
    <label><input type="radio" name="visualization" value="tree"> Tidy Tree</label>
  </div>

  <div id="chart"></div>
  <div class="tooltip"></div>

  <script>
    let nodes = [];
    let links = [];
    let graphData; // Store the original parsed data
    let currentVisualization = "force"; // Default visualization

    const svg = d3.select("#chart").append("svg");
    const tooltip = d3.select(".tooltip");
    const width = 800;
    const height = 600;

    svg.attr("width", width).attr("height", height);

    // Event listener for radio buttons
    d3.selectAll('input[name="visualization"]').on('change', function () {
      currentVisualization = this.value;
      console.log(currentVisualization)
      updateVisualization();
    });

    document.getElementById('csvFileInput').addEventListener('change', handleFileSelect);

    function handleFileSelect(event) {
      const file = event.target.files[0];
      Papa.parse(file, {
        complete: function (results) {
          graphData = results.data; // Store the original data
          processData(results.data);
        },
        header: true, // Use the first row as headers
        dynamicTyping: true  // Convert strings to numbers where possible
      });
    }


    function processData(data) {
      nodes = [];
      links = [];
      const nodeMap = new Map(); // Create a map to store nodes by ID

      // Create nodes
      data.forEach(row => {
        if (row.Good) { // Check if 'Good' exists and is not empty
          const node = { id: row.Good, type: row.Type, buyPrice: row.BuyPrice, sellPrice: row.SellPrice };
          nodes.push(node);
          nodeMap.set(row.Good, node); // Store the node in the map
        }
      });

      // Create links, using the nodeMap to get node objects
      data.forEach(row => {
        if (row.Good) {
          if (row.BaseGood1) {
            links.push({
              source: nodeMap.get(row.BaseGood1), // Get node object from map
              target: nodeMap.get(row.Good),       // Get node object from map
              quantity: row.BaseGood1Quantity
            });
          }
          if (row.BaseGood2) {
            links.push({
              source: nodeMap.get(row.BaseGood2), // Get node object from map
              target: nodeMap.get(row.Good),       // Get node object from map
              quantity: row.BaseGood2Quantity
            });
          }
        }
      });

      updateVisualization();
    }


    function updateVisualization() {
      svg.selectAll("*").remove(); // Clear previous visualization
      console.log(currentVisualization)
      if (currentVisualization === "force") {
        drawForceDirected();
      } else if (currentVisualization === "tree") {
        drawTidyTree();
      }
    }

    function drawForceDirected() {

      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(100)) // Adjust distance as needed
        .force("charge", d3.forceManyBody().strength(-400)) // Adjust strength as needed
        .force("center", d3.forceCenter(width / 2, height / 2));

      const link = svg.append("g").attr("class", "links")
        .selectAll("line")
        .data(links, d => d.target.id + "-" + d.source.id);

      const node = svg.append("g").attr("class", "nodes")
        .selectAll("g"); // Group for circle and text

      // Update links
      //   links = link.data(links, d => d.target.id + "-" + d.source.id); //Important for correct update
      //   links.exit().remove();
      //   links = links.enter().append("line")
      //       .attr("class", "link")
      //       .merge(link);

      const linksUpdate = svg.select(".links").selectAll("line")
        .data(links, d => d.target.id + "-" + d.source.id);

      linksUpdate.exit().remove();

      const linksEnter = linksUpdate.enter().append("line")
        .attr("class", "link");

      linksUpdate.merge(linksEnter); // Merge enter and update selections


      // Update nodes
      // node = node.data(nodes, d => d.id); //Important for correct update
      // node.exit().remove();
      // const nodeEnter = node.enter().append("g").attr("class", "node");
      // nodeEnter.append("circle")
      //   .attr("r", 10)
      //   .attr("fill", d => {
      //     switch (d.type) {
      //       case "Base": return "green";
      //       case "Intermediate": return "blue";
      //       case "Product": return "red";
      //       default: return "gray";
      //     }
      //   })
      //   .on("mouseover", showTooltip)
      //   .on("mouseout", hideTooltip);
      // nodeEnter.append("text")
      //   .attr("dy", ".35em")
      //   .text(d => d.id);
      // node = node.merge(nodeEnter);

      const nodesUpdate = svg.select(".nodes").selectAll("g")
        .data(nodes, d => d.id);

      nodesUpdate.exit().remove();

      const nodesEnter = nodesUpdate.enter().append("g").attr("class", "node");

      nodesEnter.append("circle")
        .attr("r", 10)
        .attr("fill", d => {
          switch (d.type) {
            case "Base": return "green";
            case "Intermediate": return "blue";
            case "Product": return "red";
            default: return "gray";
          }
        })
        .on("mouseover", showTooltip)
        .on("mouseout", hideTooltip);

      nodesEnter.append("text")
        .attr("dy", ".35em")
        .text(d => d.id);

      nodesUpdate.merge(nodesEnter); // Merge enter and update selections

      // simulation.force("link", d3.forceLink(links).id(d => d.id).distance(100));
      simulation.nodes(nodes);
      simulation.alpha(1).restart(); // Reheat simulation

      // simulation.on("tick", () => {
      //   link
      //     .attr("x1", d => d.source.x)
      //     .attr("y1", d => d.source.y)
      //     .attr("x2", d => d.target.x)
      //     .attr("y2", d => d.target.y);

      //   node.attr("transform", d => `translate(${d.x},${d.y})`);
      // });

      simulation.on("tick", () => {
        svg.selectAll(".node") // Select all node groups in the SVG
          .attr("transform", d => {
            d.x = Math.max(10, Math.min(width - 10, d.x)); // Keep within x bounds
            d.y = Math.max(10, Math.min(height - 10, d.y)); // Keep within y bounds
            // console.log(d.id + "(" + d.x + "," + d.y + ")")
            return `translate(${d.x},${d.y})`;
          });

        svg.selectAll(".link")  // Select all links in the SVG
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        // svg.selectAll(".node") // Select all node groups in the SVG
        //   .attr("transform", d => `translate(${d.x},${d.y})`);
        // Set initial positions (optional, but often helpful)
        // simulation.nodes(nodes).forEach(node => {
        //   node.x = width / 2 + Math.random() * 200 - 100; // Center with some randomness
        //   node.y = height / 2 + Math.random() * 200 - 100; // Center with some randomness
        // });
      });
    }

    function drawTidyTree() {
      const root = d3.stratify().id(d => d.Good).parentId(d => {
        if (d.Type !== "Base") {
          const parents = [];
          if (d.BaseGood1) parents.push(d.BaseGood1);
          if (d.BaseGood2) parents.push(d.BaseGood2);
          return parents.length > 0 ? parents : null; // Return array of parents or null
        }
        return null;
      })(graphData);

      const treeLayout = d3.tree().size([width, height]);
      const treeData = treeLayout(root);

      const treeNodes = treeData.descendants();
      const treeLinks = treeData.links();

      // Create a map to efficiently find nodes by ID
      const nodeMap = new Map(treeNodes.map(node => [node.data.Good, node]));

      // Draw links (now curved)
      svg.append("g")
        .attr("fill", "none")
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.6)
        .selectAll("path")
        .data(treeLinks)
        .join("path")
        .attr("d", d3.linkHorizontal({
          source: d => d.source.x,
          target: d => d.target.x
        }));

      // Draw explicit links for multiple parents
      svg.append("g")
        .attr("fill", "none")
        .attr("stroke", "red") // Highlight explicit links
        .attr("stroke-opacity", 0.8)
        .selectAll("path")
        .data(graphData.filter(d => d.Type !== "Base" && (d.BaseGood2 || d.BaseGood1))) // Filter for multi-parent goods
        .join("path")
        .attr("d", d => {
          const target = nodeMap.get(d.Good);
          const source1 = d.BaseGood1 ? nodeMap.get(d.BaseGood1) : null;
          const source2 = d.BaseGood2 ? nodeMap.get(d.BaseGood2) : null;

          // Create curved paths for each parent
          let pathStr = "";
          if (source1) {
            pathStr += d3.linkHorizontal({ source: source1, target: target })();
          }
          if (source2) {
            pathStr += d3.linkHorizontal({ source: source2, target: target })();
          }
          return pathStr;
        });


      // Draw nodes
      const node = svg.append("g")
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .selectAll("g")
        .data(treeNodes) // Use treeNodes
        .join("g")
        .attr("transform", d => `translate(${d.x},${d.y})`);

      node.append("circle")
        .attr("r", 5)
        .attr("fill", d => {
          switch (d.data.Type) {
            case "Base": return "green";
            case "Intermediate": return "blue";
            case "Product": return "red";
            default: return "gray";
          }
        })
        .on("mouseover", showTooltip)
        .on("mouseout", hideTooltip);

      node.append("text")
        .attr("dy", "0.31em")
        .attr("x", d => d.children ? -8 : 8)
        .attr("text-anchor", d => d.children ? "end" : "start")
        .text(d => d.data.id);
    }

    function showTooltip(event, d) {
      tooltip.transition().duration(200).style("opacity", .9);
      tooltip.html(`<b>${d.id}</b><br>Type: ${d.type}<br>Buy Price: ${d.buyPrice}<br>Sell Price: ${d.sellPrice}`)
        .style("left", (event.pageX + 10) + "px") // Adjust offset as needed
        .style("top", (event.pageY - 28) + "px"); // Adjust offset as needed
    }

    function hideTooltip() {
      tooltip.transition().duration(500).style("opacity", 0);
    }

    function exportCSV() {
      const csv = Papa.unparse({ fields: Object.keys(graphData[0]), data: graphData });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", "trade_goods.csv");
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

  </script>

</body>

</html>
